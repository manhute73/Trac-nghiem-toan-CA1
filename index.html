<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện trắc nghiệm từ PDF</title>
<!-- Liên kết font chữ và thư viện KaTeX để hiển thị công thức toán học -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<!-- Liên kết file CSS tùy chỉnh giao diện -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

<!-- ========================================== -->
<!-- MÀN HÌNH 1: THIẾT LẬP & TẢI FILE PDF (viewSetup) -->
<!-- ========================================== -->
<section id="viewSetup">
  <h1>Luyện trắc nghiệm từ file PDF</h1>
  <p class="lead">Thả file PDF đề vào đây. Web tự tách từng câu hỏi, cho bạn làm bài rồi chấm điểm ngay.</p>

  <!-- Ô kéo thả hoặc chọn file PDF -->
  <label class="drop" id="drop">
    <strong id="dropTitle">Chọn hoặc kéo thả file PDF</strong>
    <span class="muted small" id="dropSub">Đề cần có số câu dạng “Câu 1.” hoặc “1.”</span>
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
  </label>
  <progress id="parseProg" max="100" value="0" hidden></progress>
  <div id="parseMsg" class="notice err" hidden></div>

  <!-- Khung nhập / dán đáp án chuẩn -->
  <div id="stepKey" class="panel" hidden style="margin-top:16px">
    <h2>Đáp án</h2>
    <p id="keyStatus"></p>
    <textarea id="keyText" placeholder="Dán đáp án, ví dụ: 1A 2B 3C 4D…"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="keyApply">Áp dụng đáp án</button>
    </div>
    <div id="keyMsg" class="small muted" style="margin-top:8px"></div>
  </div>

  <!-- Khung cấu hình đề thi (khoảng câu, số câu làm, trộn câu hỏi) -->
  <div id="stepConfig" class="panel" hidden>
    <h2>Tạo đề</h2>
    <p id="parseInfo" class="muted"></p>
    <div class="row">
      <label class="field">Từ câu<input type="number" id="cFrom" min="1"></label>
      <label class="field">Đến câu<input type="number" id="cTo" min="1"></label>
      <label class="field">Số câu làm<input type="number" id="cCount" min="1" value="20"></label>
      <label class="field">Giới hạn phút (0 = không)<input type="number" id="cMin" min="0" value="0"></label>
    </div>
    <label class="check"><input type="checkbox" id="cShuffle" checked> Trộn ngẫu nhiên thứ tự câu</label>
    
    <div class="row" style="margin-top:16px">
      <button class="primary" id="btnStart">Bắt đầu làm bài</button>
      <span id="startMsg" class="small muted" role="status"></span>
    </div>
  </div>
</section>

<!-- ========================================== -->
<!-- MÀN HÌNH 2: GIAO DIỆN LÀM BÀI THI (viewQuiz) -->
<!-- ========================================== -->
<section id="viewQuiz" hidden>
  <!-- Thanh điều hướng cố định phía trên (tiến trình làm bài, thời gian, nút nộp) -->
  <div class="bar">
    <div class="grow">
      <div class="small" id="qProgText" aria-live="polite"></div>
      <progress id="qProg" max="1" value="0"></progress>
    </div>
    <div class="timer" id="qTimer">00:00</div>
    <button class="primary" id="btnSubmit">Nộp bài</button>
  </div>
  <!-- Nơi danh sách câu hỏi được tạo động bằng JavaScript -->
  <div id="quizList"></div>
  <div class="row" style="justify-content:center; margin-top: 20px;"><button class="primary" id="btnSubmit2">Nộp bài</button></div>
</section>

<!-- ========================================== -->
<!-- MÀN HÌNH 3: KẾT QUẢ VÀ TỔNG KẾT (viewResult) -->
<!-- ========================================== -->
<section id="viewResult" hidden>
  <div class="panel">
    <h2 id="rTitle">Kết quả bài làm</h2>
    <p id="rMsg" class="muted"></p>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="btnNew">Làm đề mới</button>
    </div>
  </div>
</section>

</main>

<!-- Thư viện hỗ trợ đọc PDF từ Mozilla -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Tệp chứa logic xử lý chính -->
<script src="app.js"></script>
</body>
</html>
