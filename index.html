<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện trắc nghiệm từ PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<style>
:root{
  --bg:#eef2f5; --sheet:#ffffff; --ink:#12202e; --muted:#5b6b7a; --line:#d5dee6;
  --accent:#1357d6; --accent-ink:#ffffff; --ok:#137a4b; --ok-bg:#e4f5ec; --bad:#b3261e; --bad-bg:#fce9e7; --warn-bg:#fff4d6;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e151c; --sheet:#17212b; --ink:#e7eef5; --muted:#93a4b5; --line:#2b3948;
    --accent:#6ea2ff; --accent-ink:#0b1a33; --ok:#5fd39b; --ok-bg:#12332a; --bad:#ff8f86; --bad-bg:#3a1d1b; --warn-bg:#3a3118;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
main{max-width:880px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 10px}
p{margin:0 0 10px}
.lead{color:var(--muted);margin-bottom:22px;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
[hidden]{display:none!important}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;cursor:pointer;background:var(--sheet);transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop strong{display:block;font-size:1.15rem;margin-bottom:4px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
progress{width:100%;height:10px;accent-color:var(--accent);margin-top:14px}

button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
.field input[type=number]{font:inherit;width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;margin:12px 0 0}
textarea{width:100%;min-height:84px;font:inherit;font-size:.9rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-bg);font-size:.9rem;margin-top:12px}
.err{background:var(--bad-bg);color:var(--bad)}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600}

/* quiz */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px 18px;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1;min-width:140px}
.bar progress{margin:0;height:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.q{display:grid;grid-template-columns:84px 1fr;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.q-rail{padding:14px 10px;border-right:1px solid var(--line);font-weight:700;display:flex;flex-direction:column;gap:2px}
.q-rail small{font-weight:400;color:var(--muted);font-size:.75rem}
.q-body{padding:14px;min-width:0}
.paper{background:#fff;border:1px solid #e3e8ed;border-radius:8px;padding:6px;overflow-x:auto}
.paper img{display:block;max-width:100%;height:auto;margin:0 auto}
.opts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.opt{width:56px;height:48px;font-size:1.1rem;padding:0}
.opt[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q.ok{border-color:var(--ok)} .q.ok .q-rail{background:var(--ok-bg)}
.q.bad,.q.skip{border-color:var(--bad)} .q.bad .q-rail,.q.skip .q-rail{background:var(--bad-bg)}
.verdict{margin-top:10px;font-weight:600}
.verdict .ok{color:var(--ok)} .verdict .bad{color:var(--bad)}
.score{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
.score .big{font-size:clamp(2.6rem,9vw,4rem);font-weight:700;line-height:1}
@media (max-width:560px){
  .q{grid-template-columns:1fr}
  .q-rail{flex-direction:row;gap:10px;align-items:baseline;border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* result page */
:root{--amber:#c77d00}
@media (prefers-color-scheme:dark){:root{--amber:#f2b84b}}
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .val b{font-size:2rem}
.hero-txt{flex:1;min-width:240px}
.hero-txt h2.rtitle{font-size:1.8rem;margin:2px 0 4px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-size:.75rem;font-weight:600;margin-right:6px}
.rname{font-weight:700;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 14px}
.stack i{display:block;height:100%}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums b{display:block;font-size:1.6rem;line-height:1.2}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.crow{margin:10px 0}
.crow .l{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}
.crow .bar2{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.crow .bar2 i{display:block;height:100%;background:var(--ok)}
.hist{width:100%;border-collapse:collapse;font-size:.875rem}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist tr.cur td{background:var(--bad-bg)}
.reviewhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.reviewhead h2{margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;padding:6px 12px;font-size:.85rem;background:transparent}
.tabs button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line) inset}
.rc{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.rc.ok{border-left-color:var(--ok)} .rc.bad,.rc.skip{border-left-color:var(--bad)}
.rc header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rc header .grow{flex:1}
.badge{font-size:.75rem;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad,.badge.skip{background:var(--bad-bg);color:var(--bad)}
.mark{padding:4px 10px;font-size:.8rem;border-radius:99px}
.mark[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ropts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ro{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:600;font-size:.9rem}
.ro small{display:block;font-weight:400;color:var(--muted);font-size:.7rem;min-height:1em}
.ro.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.ro.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* question cards (text + math) */
.field input[type=text],.field input[type=password]{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.qc{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.qh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.qh .grow{flex:1}
.stem{margin:6px 0 14px;line-height:2;overflow-x:auto}
.optlist{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-weight:400;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit}
button.optrow{cursor:pointer}
button.optrow:hover{border-color:var(--accent)}
.ol{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;background:var(--sheet)}
.ot{flex:1;min-width:0;overflow-x:auto}
.optrow[aria-pressed=true],.optrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--sheet))}
.optrow[aria-pressed=true] .ol,.optrow.sel .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.optrow.right{border-color:var(--ok);background:var(--ok-bg)}
.optrow.right .ol{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.optrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.optrow.wrong .ol{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.pill{font-size:.75rem;font-weight:600;padding:2px 10px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}
.optrow.right .pill{color:var(--ok)} .optrow.wrong .pill{color:var(--bad)}
details.orig{margin-top:10px} details.orig summary{font-weight:500;font-size:.85rem;color:var(--muted)}
details.orig .paper{margin-top:8px}
.katex{font-size:1.08em}
.nums{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))!important}
.badge.saide,.badge.none,.badge.unsure,.badge.nokey{background:var(--warn-bg);color:var(--amber)}
.rc.saide,.rc.none,.rc.unsure,.rc.nokey{border-left-color:var(--amber)}
</style>
</head>
<body>
<main>

<!-- ===== SETUP ===== -->
<section id="viewSetup">
  <h1>Luyện trắc nghiệm từ file PDF</h1>
  <p class="lead">Thả file PDF đề vào đây. Web tự tách từng câu hỏi, cho bạn làm bài rồi chấm điểm ngay.</p>

  <label class="drop" id="drop">
    <strong id="dropTitle">Chọn hoặc kéo thả file PDF</strong>
    <span class="muted small" id="dropSub">Đề cần có số câu dạng “Câu 1.” hoặc “1.”</span>
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
  </label>
  <progress id="parseProg" max="100" value="0" hidden></progress>
  <div id="parseMsg" class="notice err" hidden></div>

  <div id="stepKey" class="panel" hidden style="margin-top:16px">
    <h2>Đáp án</h2>
    <p id="keyStatus"></p>
    <p class="muted small">Dán đáp án để chấm điểm tự động:</p>
    <textarea id="keyText" placeholder="Ví dụ:&#10;1A 2B 3C 4D … hoặc 1-A, 2-B, …"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="keyApply">Áp dụng đáp án</button>
      <label class="btn small" style="display:inline-block">Tải file đáp án (.pdf, .txt)
        <input type="file" id="keyFile" accept=".pdf,.txt,.csv,application/pdf,text/plain" hidden>
      </label>
    </div>
    <div id="keyMsg" class="small muted" style="margin-top:8px"></div>
  </div>

  <div id="stepConfig" class="panel" hidden>
    <h2>Tạo đề</h2>
    <p id="parseInfo" class="muted"></p>
    <div class="row">
      <label class="field">Từ câu<input type="number" id="cFrom" min="1"></label>
      <label class="field">Đến câu<input type="number" id="cTo" min="1"></label>
      <label class="field">Số câu làm<input type="number" id="cCount" min="1" value="20"></label>
      <label class="field">Giới hạn phút (0 = không)<input type="number" id="cMin" min="0" value="0"></label>
    </div>
    <label class="check"><input type="checkbox" id="cShuffle" checked> Trộn ngẫu nhiên thứ tự câu</label>
    <label class="check"><input type="checkbox" id="cAI"> Dùng AI dựng lại đề dạng chữ với công thức toán chuẩn</label>
    <label class="check"><input type="checkbox" id="cCross" checked> Kiểm tra chéo độc lập</label>
    <div class="small muted" id="aiStatus" style="margin-top:6px"></div>
    <details id="aiBox">
      <summary>Cài đặt AI (API key Anthropic)</summary>
      <div class="row" style="margin-top:8px">
        <label class="field" style="flex:1;min-width:220px">API key<input type="password" id="aiKey" autocomplete="off" placeholder="sk-ant-..."></label>
        <label class="field" style="min-width:180px">Model<input type="text" id="aiModel" placeholder="claude-sonnet-5-5"></label>
        <button id="aiSave">Lưu</button>
      </div>
      <div class="small muted" id="aiMsg" style="margin-top:8px"></div>
    </details>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="btnStart">Bắt đầu làm bài</button>
      <span id="startMsg" class="small muted" role="status"></span>
    </div>
  </div>
</section>

<!-- ===== QUIZ ===== -->
<section id="viewQuiz" hidden>
  <div class="bar">
    <div class="grow">
      <div class="small" id="qProgText" aria-live="polite"></div>
      <progress id="qProg" max="1" value="0"></progress>
    </div>
    <div class="timer" id="qTimer"></div>
    <button class="primary" id="btnSubmit">Nộp bài</button>
  </div>
  <div id="quizList"></div>
  <div class="row" style="justify-content:center"><button class="primary" id="btnSubmit2">Nộp bài</button></div>
</section>

<!-- ===== RESULT ===== -->
<section id="viewResult" hidden>
  <div class="panel hero">
    <div class="ring" id="rRing" role="img"></div>
    <div class="hero-txt">
      <div><span class="chip">Thi thử</span><span class="muted small" id="rSubject"></span></div>
      <h2 class="rtitle" id="rTitle"></h2>
      <p class="muted" id="rMsg"></p>
      <div class="rname" id="rName"></div>
      <div class="small muted" id="rStat1"></div>
      <div class="small muted" id="rStat2"></div>
      <div class="row" style="margin-top:14px">
        <button class="primary" id="btnReview">Xem lại đáp án</button>
        <button id="btnAgain">Làm lại đề</button>
        <button id="btnNew">Tạo đề mới</button>
      </div>
    </div>
  </div>
  <div id="rNote" class="notice" hidden style="margin:0 0 16px"></div>
  <div class="panel">
    <h2>Tổng kết</h2>
    <div class="stack" id="rStack"></div>
    <div class="nums" id="rNums"></div>
  </div>
  <div class="reviewhead" id="reviewTop">
    <h2>Xem lại từng câu</h2>
    <div class="tabs" id="rTabs" role="group" aria-label="Lọc câu"></div>
  </div>
  <div id="resList"></div>
</section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDF_OPTS = {
  cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
  cMapPacked: true,
  standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { file: null, qs: [], byN: new Map(), key: {}, ai: {}, quiz: null, timer: null, tx: {} };

const storeId = () => 'pdfquiz:' + (state.file ? state.file.name + '|' + state.file.size : '');
function saveKey(){ try { if (state.file) localStorage.setItem(storeId(), JSON.stringify({ key: state.key, ai: state.ai })); } catch (e) {} }
function loadKey(){
  try {
    const v = JSON.parse(localStorage.getItem(storeId()) || 'null');
    if (v) { state.key = v.key || {}; state.ai = v.ai || {}; }
  } catch (e) {}
}

const SCALE = 2;

function buildLines(items, H){
  const its = items.filter(i => i.str && i.str.trim() !== '').map(i => ({
    s: i.str, x: i.transform[4], y: i.transform[5],
    h: i.height || Math.abs(i.transform[3]) || 10
  }));
  its.sort((a, b) => b.y - a.y || a.x - b.x);
  const groups = [];
  for (const it of its){
    const g = groups[groups.length - 1];
    if (g && Math.abs(g.y - it.y) <= 3.5) g.items.push(it); else groups.push({ y: it.y, items: [it] });
  }
  return groups.map(g => {
    g.items.sort((a, b) => a.x - b.x);
    return {
      text: g.items.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim().normalize('NFC'),
      x: g.items[0].x,
      topU: H - Math.max(...g.items.map(i => i.y + i.h)),
      botU: H - Math.min(...g.items.map(i => i.y)) + 2
    };
  });
}

function inkRows(ctx, w, h){
  const d = ctx.getImageData(0, 0, w, h).data;
  const rows = new Uint8Array(h);
  for (let y = 0; y < h; y++){
    let o = y * w * 4;
    for (let x = 0; x < w; x++, o += 4){
      if (d[o] + d[o + 1] + d[o + 2] < 540) { rows[y] = 1; break; }
    }
  }
  return rows;
}

async function extractQuestions(pdf, onProgress){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const questions = [];
  const pageTexts = [];
  let open = null, last = 0, chapter = '';

  const finalize = q => {
    const w = Math.max(...q.pieces.map(c => c.width));
    const h = q.pieces.reduce((s, c) => s + c.height, 0) + (q.pieces.length - 1) * 6;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    let y = 0; for (const p of q.pieces){ g.drawImage(p, 0, y); y += p.height + 6; }
    q.img = c.toDataURL('image/jpeg', 0.88);
    delete q.pieces;
  };
  const closeQ = () => { if (open && open.pieces.length){ finalize(open); questions.push(open); } open = null; };

  for (let p = 1; p <= pdf.numPages; p++){
    onProgress(p, pdf.numPages);
    await new Promise(r => setTimeout(r));
    const page = await pdf.getPage(p);
    const vp1 = page.getViewport({ scale: 1 });
    const W = vp1.width, H = vp1.height;
    const tc = await page.getTextContent();
    const lines = buildLines(tc.items, H);
    pageTexts.push(lines.map(l => l.text).join('\n'));

    const markers = [];
    for (const l of lines){
      let m = l.text.match(/^(?:Câu|CÂU)\s*(\d+)\s*[.:]/);
      if (!m && l.x <= W * 0.25) m = l.text.match(/^(\d+)\s*[.:](?!\d)/);
      if (!m) continue;
      const num = +m[1];
      if (num >= last) { last = num; markers.push({ type: 'q', num, line: l }); }
    }

    const vp = page.getViewport({ scale: SCALE });
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const rows = inkRows(ctx, canvas.width, canvas.height);
    const CH = canvas.height;

    const findCut = T => Math.max(0, Math.floor(T * SCALE) - 10);
    const crop = (y0, y1) => {
      const x0 = 0, x1 = canvas.width;
      const c = document.createElement('canvas'); c.width = x1 - x0; c.height = Math.max(10, y1 - y0);
      c.getContext('2d').drawImage(canvas, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
      return c;
    };

    markers.forEach(m => { m.cut = findCut(m.line.topU); });
    const firstCut = markers.length ? markers[0].cut : CH;
    if (open && firstCut > 0) open.pieces.push(crop(0, firstCut));
    markers.forEach((m, i) => {
      const end = i + 1 < markers.length ? markers[i + 1].cut : CH;
      closeQ();
      open = { n: m.num, chapter, pieces: [] };
      if (end - m.cut > 0) open.pieces.push(crop(m.cut, end));
    });
    page.cleanup();
  }
  closeQ();
  return { questions, pageTexts };
}

function parseKey(text){
  const out = {};
  const t = text.replace(/Câu/gi, ' ');
  for (const m of t.matchAll(/(\d{1,4})\s*[.\-:)\]=]?\s*([A-Ea-e])(?![A-Za-zÀ-ỹ])/g)) out[+m[1]] = m[2].toUpperCase();
  return out;
}

function mergeKey(map){
  let n = 0;
  for (const k of Object.keys(map)){
    if (!state.byN.has(+k)) continue;
    state.key[k] = map[k]; delete state.ai[k]; n++;
  }
  saveKey(); refreshKeyStatus();
  return n;
}

function refreshKeyStatus(){
  const have = state.qs.filter(q => state.key[q.n]).length;
  $('#keyStatus').textContent = `Đã có đáp án cho ${have}/${state.qs.length} câu.`;
}

function show(id){
  for (const v of ['#viewSetup', '#viewQuiz', '#viewResult']) $(v).hidden = v !== id;
  window.scrollTo(0, 0);
}

async function handleFile(file){
  if (!file) return;
  state.file = file; state.qs = []; state.byN = new Map(); state.key = {}; state.ai = {}; state.tx = {};
  $('#parseMsg').hidden = true; $('#stepKey').hidden = true; $('#stepConfig').hidden = true;
  const prog = $('#parseProg'); prog.hidden = false; prog.value = 0;
  $('#dropTitle').textContent = file.name;
  try {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), ...PDF_OPTS }).promise;
    const { questions, pageTexts } = await extractQuestions(pdf, (p, n) => {
      prog.value = Math.round(p / n * 100);
      $('#dropSub').textContent = `Đang đọc trang ${p}/${n}…`;
    });
    
    if (!questions.length){
      // Fallback nếu không tách theo định dạng câu tiêu chuẩn: Tạo danh sách trang hoặc câu giả lập đơn giản
      $('#parseMsg').textContent = 'Không tìm thấy câu hỏi tự động. Vui lòng kiểm tra lại cấu trúc file PDF.';
      prog.hidden = true;
      return;
    }

    state.qs = questions; state.byN = new Map(questions.map(q => [q.n, q]));
    loadKey();
    prog.hidden = true;
    $('#dropSub').textContent = `Đã tách ${questions.length} câu.`;
    const first = questions[0].n, lastN = questions[questions.length - 1].n;
    $('#parseInfo').textContent = `Tìm thấy ${questions.length} câu (từ câu ${first} đến câu ${lastN}).`;
    $('#cFrom').value = first; $('#cTo').value = lastN;
    $('#cCount').value = Math.min(20, questions.length);
    refreshKeyStatus();
    $('#stepKey').hidden = false; $('#stepConfig').hidden = false;
  } catch (e){
    console.error(e);
    $('#parseMsg').textContent = 'Không đọc được file: ' + (e && e.message ? e.message : e);
    prog.hidden = true;
  }
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

function onStart(){
  const from = +$('#cFrom').value || 0, to = +$('#cTo').value || 1e9;
  let pool = state.qs.filter(q => q.n >= from && q.n <= to);
  if (!pool.length) pool = state.qs.slice(0, 20); // Fallback lấy toàn bộ nếu lọc lỗi
  if (!pool.length){ alert('Không có câu hỏi nào trong khoảng này!'); return; }
  
  const count = Math.max(1, Math.min(+$('#cCount').value || pool.length, pool.length));
  pool = $('#cShuffle').checked ? shuffle(pool.slice()).slice(0, count) : pool.slice(0, count);
  startQuiz(pool, +$('#cMin').value || 0);
}

function quizCard(q, i){
  return `<article class="qc" id="q${i}" data-n="${q.n}">
    <div class="qh"><b>Câu ${i + 1}</b><span class="grow"></span><span class="muted small">Đề gốc ${q.n}</span></div>
    <div class="paper"><img src="${q.img}" alt="Nội dung câu ${i + 1}"></div>
    <div class="opts" role="group" aria-label="Chọn đáp án câu ${i + 1}">
      ${['A', 'B', 'C', 'D'].map(v => `<button class="opt" data-v="${v}" aria-pressed="false" aria-label="Đáp án ${v}">${v}</button>`).join('')}
    </div></article>`;
}

function startQuiz(items, mins){
  state.quiz = { items, answers: {}, start: Date.now(), limit: (mins || 0) * 60, mins: mins || 0, done: false };
  $('#quizList').innerHTML = items.map(quizCard).join('');
  updateProg();
  clearInterval(state.timer);
  const tick = () => {
    const el = Math.floor((Date.now() - state.quiz.start) / 1000);
    if (state.quiz.limit){
      const left = state.quiz.limit - el;
      $('#qTimer').textContent = 'Còn ' + fmtTime(left);
      if (left <= 0) submit(true);
    } else $('#qTimer').textContent = fmtTime(el);
  };
  tick(); state.timer = setInterval(tick, 1000);
  show('#viewQuiz');
}

function updateProg(){
  const Q = state.quiz, done = Q.items.filter(q => Q.answers[q.n]).length;
  $('#qProg').max = Q.items.length; $('#qProg').value = done;
  $('#qProgText').textContent = `Đã làm ${done}/${Q.items.length} câu`;
}

$('#quizList').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (!b || state.quiz.done) return;
  const card = b.closest('.qc'), n = card.dataset.n, v = b.dataset.v;
  if (state.quiz.answers[n] === v) delete state.quiz.answers[n]; else state.quiz.answers[n] = v;
  card.querySelectorAll('[data-v]').forEach(o => o.setAttribute('aria-pressed', String(state.quiz.answers[n] === o.dataset.v)));
  updateProg();
});

function submit(force){
  const Q = state.quiz; if (!Q || Q.done) return;
  Q.done = true; Q.elapsed = (Date.now() - Q.start) / 1000;
  clearInterval(state.timer);
  showResult();
}

function verdict(q){
  const k = state.key[q.n], a = state.quiz.answers[q.n];
  if (!k) return { kind: 'nokey' };
  return { kind: 'key', ans: k };
}

function showResult(){
  const Q = state.quiz; let ok = 0, bad = 0, skip = 0, nokey = 0;
  Q.items.forEach(q => {
    const v = verdict(q), a = Q.answers[q.n]; q.v = v;
    q.st = v.kind === 'nokey' ? 'nokey' : !a ? 'skip' : a === v.ans ? 'ok' : 'bad';
    if (q.st === 'ok') ok++; else if (q.st === 'bad') bad++; else if (q.st === 'skip') skip++; else nokey++;
  });
  const graded = ok + bad + skip, p = graded ? ok / graded : 0, score = p * 10;
  
  $('#rRing').innerHTML = `<svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><circle cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-dasharray="${p * 326.7} 326.7" stroke="var(--ok)"/></svg><div class="val"><b>${score.toFixed(1)}</b><span class="muted small">/10</span></div>`;
  $('#rTitle').textContent = score >= 5 ? 'Đạt kết quả tốt!' : 'Cần cố gắng thêm';
  $('#rMsg').textContent = `Đúng ${ok}/${graded} câu được chấm điểm.`;
  $('#rStat1').textContent = `Thời gian làm bài: ${fmtTime(Q.elapsed)}`;

  $('#rStack').innerHTML = `<i style="width:${ok/Q.items.length*100}%;background:var(--ok)"></i><i style="width:${bad/Q.items.length*100}%;background:var(--bad)"></i><i style="width:${skip/Q.items.length*100}%;background:var(--muted)"></i>`;
  $('#rNums').innerHTML = `<div><span class="small muted">Đúng</span><b>${ok}</b></div><div><span class="small muted">Sai</span><b>${bad}</b></div><div><span class="small muted">Bỏ trống</span><b>${skip}</b></div><div><span class="small muted">Tổng</span><b>${Q.items.length}</b></div>`;

  $('#resList').innerHTML = Q.items.map((q, i) => {
    const v = q.v, k = v.ans || 'Chưa có', a = Q.answers[q.n] || 'Chưa chọn';
    return `<article class="rc ${q.st}"><header><b>Câu ${i + 1}</b><span class="badge ${q.st}">${q.st.toUpperCase()}</span></header><div class="paper"><img src="${q.img}"></div><div class="verdict">Bạn chọn: <b>${a}</b> | Đáp án đúng: <b>${k}</b></div></article>`;
  }).join('');
  show('#viewResult');
}

// Gắn sự kiện
$('#fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
$('#keyApply').addEventListener('click', () => {
  const n = mergeKey(parseKey($('#keyText').value));
  $('#keyMsg').textContent = `Đã nhận ${n} đáp án.`;
});
$('#keyFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text();
  const n = mergeKey(parseKey(text));
  $('#keyMsg').textContent = `Đã nhận ${n} đáp án từ file.`;
});
$('#btnStart').addEventListener('click', onStart);
$('#btnSubmit').addEventListener('click', () => submit(true));
$('#btnSubmit2').addEventListener('click', () => submit(true));
$('#btnNew').addEventListener('click', () => show('#viewSetup'));
$('#btnAgain').addEventListener('click', () => startQuiz(shuffle(state.quiz.items), state.quiz.mins));
$('#btnReview').addEventListener('click', () => $('#reviewTop').scrollIntoView({ behavior: 'smooth' }));
</script>
</body>
</html>
