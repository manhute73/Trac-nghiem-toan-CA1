<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Luyện Đề Thi - TestMaster Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- Top Browser Bar -->
    <header class="bg-[#1e293b] text-slate-300 px-4 py-2.5 flex items-center justify-between text-sm select-none border-b border-slate-700">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
            <span class="ml-3 font-medium text-slate-200">Web Luyện Đề Thi</span>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="switchTab('dashboard')" class="hover:text-white transition"><i class="fa-solid fa-house mr-1"></i> Trang chủ</button>
            <button onclick="switchTab('pdf-creator')" class="hover:text-white transition"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Tự Động Cắt PDF</button>
            <button onclick="loadSampleExam()" class="hover:text-rose-400 transition font-medium"><i class="fa-solid fa-bolt mr-1"></i> Đề Mẫu</button>
        </div>
    </header>

    <!-- Main Container Card -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 min-h-[600px] flex flex-col">
            
            <!-- App Header Navigation -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 mb-6 border-b border-slate-100 gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-rose-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-md shadow-rose-200">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900">TestMaster Pro</h1>
                        <p class="text-xs text-slate-500">Tự động nhận diện và cắt câu hỏi từ PDF</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="switchTab('pdf-creator')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-rose-600"></i> Tự Động Cắt PDF
                    </button>
                    <button onclick="loadSampleExam()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2 border border-rose-200">
                        <i class="fa-solid fa-bolt"></i> Đề Mẫu Sẵn Có
                    </button>
                </div>
            </div>
